nameOverride: paymentservice

image:
  repository: us-central1-docker.pkg.dev/google-samples/microservices-demo/paymentservice
  tag: v0.10.4

containerPort: 50051

service:
  type: ClusterIP
  portName: grpc
  port: 50051

env:
  - name: PORT
    value: "50051"
  - name: DISABLE_PROFILER
    value: "1"

readinessProbe:
  enabled: true
  type: grpc
  port: 50051

livenessProbe:
  enabled: true
  type: grpc
  port: 50051

