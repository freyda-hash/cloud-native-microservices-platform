nameOverride: currencyservice

image:
  repository: us-central1-docker.pkg.dev/google-samples/microservices-demo/currencyservice
  tag: v0.10.4

containerPort: 7000

service:
  type: ClusterIP
  portName: grpc
  port: 7000

env:
  - name: PORT
    value: "7000"
  - name: DISABLE_PROFILER
    value: "1"

readinessProbe:
  enabled: true
  type: grpc
  port: 7000

livenessProbe:
  enabled: true
  type: grpc
  port: 7000


