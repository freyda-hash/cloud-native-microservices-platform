nameOverride: emailservice

image:
  repository: us-central1-docker.pkg.dev/google-samples/microservices-demo/emailservice
  tag: v0.10.4

containerPort: 8080

service:
  type: ClusterIP
  portName: grpc
  port: 5000

env:
  - name: PORT
    value: "8080"
  - name: DISABLE_PROFILER
    value: "1"

readinessProbe:
  enabled: true
  type: grpc
  port: 8080
  periodSeconds: 5

livenessProbe:
  enabled: true
  type: grpc
  port: 8080
  periodSeconds: 5

