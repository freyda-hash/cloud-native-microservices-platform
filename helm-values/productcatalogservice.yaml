nameOverride: productcatalogservice

image:
  repository: us-central1-docker.pkg.dev/google-samples/microservices-demo/productcatalogservice
  tag: v0.10.4

containerPort: 3550

service:
  type: ClusterIP
  portName: grpc
  port: 3550

env:
  - name: PORT
    value: "3550"
  - name: DISABLE_PROFILER
    value: "1"

readinessProbe:
  enabled: true
  type: grpc
  port: 3550

livenessProbe:
  enabled: true
  type: grpc
  port: 3550

