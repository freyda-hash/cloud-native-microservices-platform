nameOverride: adservice

image:
  repository: us-central1-docker.pkg.dev/google-samples/microservices-demo/adservice
  tag: v0.10.4

containerPort: 9555

service:
  type: ClusterIP
  portName: grpc
  port: 9555

env:
  - name: PORT
    value: "9555"

readinessProbe:
  enabled: true
  type: grpc
  port: 9555
  initialDelaySeconds: 20
  periodSeconds: 15

livenessProbe:
  enabled: true
  type: grpc
  port: 9555
  initialDelaySeconds: 20
  periodSeconds: 15

