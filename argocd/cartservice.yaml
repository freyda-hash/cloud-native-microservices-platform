apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-cartservice
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/freyda-hash/cloud-native-microservices-platform.git
    targetRevision: mboumba_perrine
    path: charts/online-boutique-service
    helm:
      valueFiles:
        - helm-values/cartservice.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: online-boutique-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

