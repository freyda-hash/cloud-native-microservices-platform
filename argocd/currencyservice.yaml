apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-currencyservice
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.esiea.fr/bastien.ceriani/k8s-gitops.git
    targetRevision: mboumba_perrine
    path: tp-k8s-esiea-2026/mboumba_perrine/charts/online-boutique-service
    helm:
      valueFiles:
        - ../../helm-values/dev/currencyservice.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: online-boutique-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

